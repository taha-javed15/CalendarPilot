
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalendarPilot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity=".08"/>
                <path
                    d="M10 12H22M10 16H18M10 20H15"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"/>
                <rect
                    x="21"
                    y="9"
                    width="4"
                    height="4"
                    rx="1"
                    fill="currentColor"
                    fill-opacity=".45"/>
            </svg>
        </div>

        <div class="brand-text">
            <h1>CalendarPilot</h1>
            <p>AI-powered calendar assistant</p>
        </div>

    </div>

    <div class="status">

        <span class="status-dot" aria-hidden="true"></span>

        <span class="status-label">
            Connected
        </span>

    </div>

</header>

<main id="chat">

    <section id="welcome" class="welcome">

        <div class="welcome-logo" aria-hidden="true">

            <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity=".05"/>
                <path
                    d="M10 12H22M10 16H18M10 20H15"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"/>
                <rect
                    x="21"
                    y="9"
                    width="4"
                    height="4"
                    rx="1"
                    fill="currentColor"
                    fill-opacity=".45"/>
            </svg>

        </div>

        <h2>What can I help you schedule today?</h2>

        <p>
            Create meetings, update events, invite attendees,
            find available time, or manage your Google Calendar
            using natural language.
        </p>

    </section>

    <section
        id="messages"
        class="messages"
        aria-live="polite"
        aria-atomic="false">

    </section>

</main>

<footer>

    <form
        id="composer"
        class="composer"
        autocomplete="off">

        <div class="input-wrapper">

            <textarea
                id="input"
                rows="1"
                placeholder="Message CalendarPilot..."
                aria-label="Message CalendarPilot"
                required></textarea>

            <button
                id="send"
                class="send"
                type="submit"
                aria-label="Send">

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.25"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>

                </svg>

            </button>

        </div>

        <p class="hint">
            Press <strong>Enter</strong> to send ·
            <strong>Shift + Enter</strong> for a new line
        </p>

    </form>

</footer>

<template id="assistant-message-template">

    <article class="message assistant">

        <div class="avatar" aria-hidden="true">

            <svg width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity=".08"/>
                <path
                    d="M10 12H22M10 16H18M10 20H15"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"/>
                <rect
                    x="21"
                    y="9"
                    width="4"
                    height="4"
                    rx="1"
                    fill="currentColor"
                    fill-opacity=".45"/>
            </svg>

        </div>

        <div class="bubble"></div>

    </article>

</template>

<template id="user-message-template">

    <article class="message user">

        <div class="bubble"></div>

    </article>

</template>

<template id="typing-template">

    <article class="message assistant">

        <div class="avatar" aria-hidden="true">

            <svg width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity=".08"/>
                <path
                    d="M10 12H22M10 16H18M10 20H15"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"/>
                <rect
                    x="21"
                    y="9"
                    width="4"
                    height="4"
                    rx="1"
                    fill="currentColor"
                    fill-opacity=".45"/>
            </svg>

        </div>

        <div class="bubble typing">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </article>

</template>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="/static/script.js"></script>

</body>
</html>
